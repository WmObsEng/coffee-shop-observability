---
- name: Preparar nós para OpenSearch
  hosts: k3s_cluster
  become: true
  gather_facts: false

  tasks:
    - name: Configurar vm.max_map_count
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Validar vm.max_map_count
      ansible.builtin.command:
        cmd: sysctl -n vm.max_map_count
      register: max_map_count
      changed_when: false

    - name: Exibir resultado
      ansible.builtin.debug:
        var: max_map_count.stdout
