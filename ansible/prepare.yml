---
- name: Preparar servidores para o cluster k3s
  hosts: k3s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Atualizar cache do APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependências essenciais
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - gnupg
          - jq
          - vim
          - git
          - open-iscsi
          - nfs-common
        state: present

    - name: Ativar serviço iSCSI
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true

    - name: Desabilitar swap
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Comentar entradas de swap no fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Persistir módulos necessários
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Carregar módulo overlay
      ansible.builtin.command: modprobe overlay
      changed_when: false

    - name: Carregar módulo br_netfilter
      ansible.builtin.command: modprobe br_netfilter
      changed_when: false

    - name: Configurar parâmetros de rede do Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Aplicar sysctl

  handlers:
    - name: Aplicar sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
