apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coffee-shop
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - coffee-shop
  selector:
    matchLabels:
      app.kubernetes.io/name: coffee-shop
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
