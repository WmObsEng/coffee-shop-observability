---
kind: DaemonSet

serviceAccount:
  create: true

rbac:
  create: true

resources:
  requests:
    cpu: 20m
    memory: 32Mi
    ephemeral-storage: 10Mi
  limits:
    cpu: 100m
    memory: 96Mi
    ephemeral-storage: 50Mi

tolerations:
  - operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - processo-seletivo-3-observabilidade-1

config:
  service: |
    [SERVICE]
        Daemon        Off
        Flush         10
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        storage.type  memory

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_coffee-shop_*.log
        Tag               kube.coffee-shop.*
        Parser            cri
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  15
        Rotate_Wait       5
        Read_from_Head    Off

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            On
        Labels              On
        Annotations         Off

    [FILTER]
        Name          record_modifier
        Match         kube.*
        Record        collector fluent-bit
        Record        environment observability-lab

  outputs: |
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch-cluster-master.opensearch.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     kubernetes-logs
        Suppress_Type_Name  On
        Retry_Limit         3

  customParsers: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
