---
clusterName: opensearch-cluster
nodeGroup: master

singleNode: true
replicas: 1

roles:
  - master
  - ingest
  - data
  - remote_cluster_client

opensearchJavaOpts: "-Xms512M -Xmx512M"

config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true

extraEnvs:
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1536Mi

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

service:
  type: NodePort
  nodePort: 30920

nodeSelector:
  workload: opensearch

antiAffinity: soft
